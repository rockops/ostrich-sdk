[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ostrich-sdk"
version = "0.1.1"
description = "Ostrich SDK Core CLI and Templating Engine"
readme = "README.md"
authors = [
    { name = "Ostrich Team" }
]
requires-python = ">=3.10"
dependencies = [
    "cachetools==6.2.4",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "go-template==0.0.3",
    "google-auth==2.47.0",
    "idna==3.11",
    "kubernetes==34.1.0",
    "oauthlib==3.3.1",
    "pyasn1==0.6.1",
    "pyasn1-modules==0.4.2",
    "python-dateutil==2.9.0.post0",
    "PyYAML==6.0.3",
    "requests==2.32.5",
    "requests-oauthlib==2.0.0",
    "rsa==4.9.1",
    "six==1.17.0",
    "urllib3==2.3.0",
    "websocket-client==1.9.0",
    "tqdm==4.66.5",
    "jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "jsonpath-ng==1.7.0",
    "pytest==9.0.2",
    "colorama==0.4.6",
    "pytest-cov==7.0.0",
    "semver==3.0.4",
    "glom==25.12.0",
    "jsonschema==4.26.0",
    "envsubst"
]

[project.scripts]
ost = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["config.yaml", "templates/**/*", "test-templates/**/*", "VERSION"]
